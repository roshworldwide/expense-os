{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bastian Build Expense OS — Ultra-premium financial dashboard for The RoSh Worldwide.">
    <title>{% block title %}Bastian Build Expense OS{% endblock %}</title>

    <!-- Google Fonts — SF-style clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- =========================================================
         Animated Background Orbs (Apple-style)
         ========================================================= -->
    <div class="bg-animation" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
    </div>

    <!-- =========================================================
         Main Application Shell
         ========================================================= -->
    <div id="app-shell">
        <!-- Top Nav -->
        <nav class="top-bar">
            <div class="container-fluid d-flex align-items-center justify-content-between px-4">
                <div class="brand d-flex align-items-center gap-3">
                    <div class="brand-icon">
                        <i class="bi bi-building-gear"></i>
                    </div>
                    <div>
                        <h1 class="brand-title">Bastian Build</h1>
                        <span class="brand-subtitle">Expense OS</span>
                    </div>
                </div>
                <div class="nav-meta d-flex align-items-center gap-4">
                    <div class="system-clock" id="systemClock"></div>
                    <div class="entity-badge">
                        <i class="bi bi-globe2 me-1"></i>
                        The RoSh Worldwide
                    </div>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <main class="main-content">
            <div class="container-fluid px-4">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container-fluid px-4 text-center">
                <span>&copy; 2026 The RoSh Worldwide &mdash; Bastian Build Expense OS v1.0</span>
            </div>
        </footer>
    </div>

    <!-- =========================================================
         Toast Container for Notifications
         ========================================================= -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- =========================================================
         Scripts
         ========================================================= -->
    <!-- jQuery 3.7 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic -->
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
